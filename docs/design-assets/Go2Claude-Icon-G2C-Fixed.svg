<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS Squircle Shape -->
    <path id="squircle" d="M 185.4,0 L 838.6,0 C 941.2,0 1024,82.8 1024,185.4 L 1024,838.6 C 1024,941.2 941.2,1024 838.6,1024 L 185.4,1024 C 82.8,1024 0,941.2 0,838.6 L 0,185.4 C 0,82.8 82.8,0 185.4,0 Z"/>
    
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <!-- AI Glow -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.35" />
      <stop offset="60%" style="stop-color:#2563EB;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0" />
    </radialGradient>
    
    <!-- Terminal Green Glow -->
    <radialGradient id="terminalGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:0.45" />
      <stop offset="70%" style="stop-color:#16A34A;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#15803D;stop-opacity:0" />
    </radialGradient>
    
    <!-- Glass Material -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="30%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    
    <!-- G2C Gradient -->
    <linearGradient id="g2cGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="g2cGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feFlood flood-color="#22C55E" flood-opacity="0.6"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Layer 1: Background -->
  <use href="#squircle" fill="url(#bgGradient)"/>
  
  <!-- Layer 2: AI Glow -->
  <use href="#squircle" fill="url(#aiGlow)"/>
  
  <!-- Layer 3: Terminal Glow -->
  <circle cx="512" cy="614" r="220" fill="url(#terminalGlow)"/>
  
  <!-- Layer 4: G2C Letters -->
  <g transform="translate(512, 512)" filter="url(#g2cGlow)">
    <!-- G Letter -->
    <path d="M -200,-90 L -200,90 C -200,140 -150,190 -100,190 L -30,190 C 20,190 70,140 70,90 L 70,50 L -20,50 L -20,80 C -20,110 -50,140 -80,140 C -110,140 -140,110 -140,80 L -140,-80 C -140,-110 -110,-140 -80,-140 L -30,-140 C -10,-140 10,-120 10,-100 L 10,-120 C 10,-170 -30,-210 -80,-210 L -150,-210 C -200,-210 -250,-170 -250,-120 L -250,-80 C -250,-30 -200,20 -150,20 L -120,20 L -120,-60 L -70,-60 L -70,-90 L -150,-90 C -180,-90 -200,-70 -200,-40 Z" 
          fill="url(#g2cGradient)" opacity="0.95"/>
    
    <!-- 2 Letter -->
    <path d="M 50,-210 L 150,-210 C 210,-210 270,-160 270,-100 L 270,-40 C 270,30 210,90 150,90 L 50,150 L 50,210 L 330,210 L 330,130 L 110,130 L 110,90 C 110,60 130,40 160,40 L 190,40 C 240,40 290,-10 290,-60 L 290,-100 C 290,-160 230,-210 170,-210 L 50,-210 Z" 
          fill="url(#g2cGradient)" opacity="0.95"/>
    
    <!-- C Letter (OPEN on right side) -->
    <path d="M 380,-210 L 500,-210 C 570,-210 630,-160 630,-90 L 630,90 C 630,160 570,210 500,210 L 380,210 C 310,210 250,160 250,90 L 250,-90 C 250,-160 310,-210 380,-210 Z M 320,90 C 320,130 360,170 400,170 L 480,170 C 520,170 560,130 560,90 L 560,-90 C 560,-130 520,-170 480,-170 L 400,-170 C 360,-170 320,-130 320,-90 L 320,90 Z M 560,-20 L 500,-20 C 470,-20 450,0 450,30 L 450,70 C 450,100 470,120 500,120 L 540,120 C 560,120 570,110 570,90 L 570,-90 C 570,-110 560,-120 540,-120 L 500,-120 C 470,-120 450,-100 450,-70 L 450,-30 C 450,0 470,20 500,20 L 580,20" 
          fill="url(#g2cGradient)" opacity="0.95" stroke="url(#g2cGradient)" stroke-width="0"/>
  </g>
  
  <!-- Layer 5: Terminal Cursor (underscore) -->
  <g transform="translate(512, 680)" opacity="0.6">
    <rect x="-120" y="0" width="240" height="12" rx="6" fill="#22C55E" opacity="0.8"/>
  </g>
  
  <!-- Layer 6: Sparkles -->
  <g transform="translate(512, 512)">
    <g transform="translate(-280, -200)">
      <path d="M 0,-16 L 3,6 L 9,9 L 3,12 L 0,20 L -3,12 L -9,9 L -3,6 Z" fill="#3B82F6" opacity="0.8"/>
    </g>
    <g transform="translate(280, -200)">
      <path d="M 0,-16 L 3,6 L 9,9 L 3,12 L 0,20 L -3,12 L -9,9 L -3,6 Z" fill="#8B5CF6" opacity="0.8"/>
    </g>
    <g transform="translate(0, 280)">
      <path d="M 0,-12 L 2,4 L 6,6 L 2,8 L 0,14 L -2,8 L -6,6 L -2,4 Z" fill="#22C55E" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Layer 7: Glass Highlight -->
  <use href="#squircle" fill="url(#glassHighlight)"/>
  
  <!-- Layer 8: Edge Highlight -->
  <path d="M 0,185.4 C 0,82.8 82.8,0 185.4,0 L 400,0 C 280,0 180,100 180,220 L 0,220 Z" fill="url(#edgeHighlight)"/>
</svg>
