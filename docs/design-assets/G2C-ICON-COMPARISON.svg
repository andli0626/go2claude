<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" fill="#F8FAFC" font-size="32" font-weight="700">Go2Claude Icon Evolution</text>
  <text x="600" y="95" text-anchor="middle" fill="#94A3B8" font-size="18">Version 1.0 vs Version 2.0 (G2C)</text>
  
  <!-- Version 1 Frame -->
  <rect x="50" y="140" width="500" height="420" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="300" y="180" text-anchor="middle" fill="#CBD5E1" font-size="24" font-weight="600">Version 1.0 - Terminal Focus</text>
  
  <!-- Version 1 Icon Representation -->
  <rect x="175" y="220" width="250" height="250" rx="46" fill="#1E293B"/>
  <path d="M 295,300 L 355,360 L 370,345 L 325,300 L 420,300 L 420,270 L 310,270 Z" fill="#22C55E"/>
  <rect x="295" y="380" width="90" height="12" rx="6" fill="#22C55E"/>
  <circle cx="380" cy="260" r="15" fill="#3B82F6"/>
  <text x="300" y="520" text-anchor="middle" fill="#94A3B8" font-size="16">Original: >_ symbol</text>
  
  <!-- Version 2 Frame -->
  <rect x="650" y="140" width="500" height="420" rx="20" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.3)" stroke-width="2"/>
  <text x="900" y="180" text-anchor="middle" fill="#22C55E" font-size="24" font-weight="600">Version 2.0 - G2C Brand</text>
  
  <!-- Version 2 Icon Representation -->
  <rect x="775" y="220" width="250" height="250" rx="46" fill="#1E293B"/>
  <text x="900" y="370" text-anchor="middle" fill="url(#g2cGradNew)" font-size="72" font-weight="800" font-family="Arial Black">G2C</text>
  <defs>
    <linearGradient id="g2cGradNew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="820" y="390" width="160" height="10" rx="5" fill="#22C55E" opacity="0.7"/>
  <circle cx="800" cy="260" r="12" fill="#3B82F6"/>
  <circle cx="1000" cy="260" r="12" fill="#8B5CF6"/>
  <circle cx="900" cy="440" r="10" fill="#22C55E"/>
  <text x="900" y="520" text-anchor="middle" fill="#22C55E" font-size="16">NEW: G2C typography</text>
  
  <!-- Comparison Arrow -->
  <path d="M 560,350 L 640,350" stroke="#64748B" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>
  
  <!-- Bottom Comparison -->
  <text x="600" y="570" text-anchor="middle" fill="#64748B" font-size="14">
    ✓ Terminal Symbol → ✓ Brand Identity  |  ✓ Generic → ✓ Unique  |  ✓ Implicit → ✓ Explicit (G2C = Go2Claude)
  </text>
</svg>
